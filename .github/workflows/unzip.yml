name: Unzip
on: workflow_dispatch
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          unzip -q rclone-manager.zip -d /tmp/x
          rm rclone-manager.zip
          rm -rf /tmp/x/rclone-manager/.github
          cp -a /tmp/x/rclone-manager/. .
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add -A
          git commit -m "Extract project"
          git push
