name: Build APK (arm64-v8a)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      rclone_version:
        description: "Tag rclone (kosong = latest)"
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Resolve rclone version
        id: rc
        run: |
          V="${{ github.event.inputs.rclone_version }}"
          if [ -z "$V" ]; then
            V=$(curl -fsSL https://api.github.com/repos/rclone/rclone/releases/latest | jq -r .tag_name)
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Cache rclone binary
        id: cache
        uses: actions/cache@v4
        with:
          path: app/src/main/jniLibs/arm64-v8a/librclone.so
          key: rclone-android-arm64-${{ steps.rc.outputs.version }}

      - name: Build rclone (android/arm64, cgo via NDK)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          V="${{ steps.rc.outputs.version }}"
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          export CC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android30-clang"
          git clone --depth 1 --branch "$V" https://github.com/rclone/rclone.git /tmp/rclone
          cd /tmp/rclone
          mkdir -p "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a"
          CGO_ENABLED=1 GOOS=android GOARCH=arm64 \
            go build -trimpath -buildmode=pie -tags noselfupdate \
            -ldflags "-s -w -X github.com/rclone/rclone/fs.Version=${V}-rcm" \
            -o "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/librclone.so" .
          ls -lh "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Decode keystore (opsional)
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi
      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Show signing certificate
        run: |
          AS=$(ls $ANDROID_HOME/build-tools/*/apksigner | tail -1)
          $AS verify --print-certs app/build/outputs/apk/release/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: rclone-manager-arm64
          path: app/build/outputs/apk/release/*.apk
          
